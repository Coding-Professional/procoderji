name: Bug report
description: Report a reproducible problem with the site.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check whether this problem has already been reported.
        For setup questions, use Discussions. Report vulnerabilities privately through
        [SECURITY.md](https://github.com/procoderji-com/procoderji/blob/main/SECURITY.md),
        and remove credentials or personal data from logs and screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Select ...\n3. See the error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome on Android, Firefox on Windows, etc.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed passwords, tokens and personal information from this report.
          required: true
