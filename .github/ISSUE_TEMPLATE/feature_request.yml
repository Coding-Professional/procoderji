name: Feature request
description: Suggest an improvement for students or contributors.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain who is affected and what they need to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe a possible solution. Screenshots or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options or context
      description: Add any alternatives, constraints or related issues.
