version: 2
# Version updates run monthly so dependency pull requests stay few. Security
# updates, when enabled in the repository settings, do not follow this schedule.
updates:
  - package-ecosystem: npm
    target-branch: dev
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one pull request per dependency type.
    # Major updates keep their own pull requests so breaking changes are reviewed
    # one at a time.
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # lucide-react 1.x removes brand icons, including the `Youtube` icon used in
      # src/components/landing/latest-videos.tsx and why-us.tsx. Remove this rule
      # when those icons are replaced.
      - dependency-name: lucide-react
        update-types:
          - version-update:semver-major
      # @types/node must match the Node.js major version used in CI (24). Update
      # it by hand when the Node.js version changes.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: nuget
    target-branch: dev
    # Dependabot expands ProCoderJi.slnx here, covering the API and test projects
    # together so shared .NET packages can move in one reviewed pull request.
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
