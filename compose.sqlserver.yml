x-database-environment: &database-environment
  Database__Provider: SqlServer
  ConnectionStrings__Platform: Server=db,1433;Database=procoderji;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in deploy/container.env};Encrypt=True;TrustServerCertificate=True

services:
  api:
    environment: *database-environment
  migrate:
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA:?Read the SQL Server license and set MSSQL_ACCEPT_EULA=Y}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in deploy/container.env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
