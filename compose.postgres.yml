x-database-environment: &database-environment
  Database__Provider: Postgres
  ConnectionStrings__Platform: Host=db;Port=5432;Database=procoderji;Username=procoderji;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/container.env}

services:
  api:
    environment: *database-environment
  migrate:
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: procoderji
      POSTGRES_USER: procoderji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/container.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
